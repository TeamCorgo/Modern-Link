name: Build image

# Builds the Debian disk image. The kernel comes from a GitHub Release made by
# kernel.yml, which only compiles when the kernel config or build script change.

on:
  push:
    paths:
      - "kernel/**"
      - "rootfs/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  kernel:
    uses: ./.github/workflows/kernel.yml
    permissions:
      contents: write

  image:
    needs: kernel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Fetch prebuilt kernel
        run: kernel/fetch.sh

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Build root filesystem
        run: |
          docker build --platform linux/arm/v7 -f rootfs/Dockerfile -t steamlink-rootfs .
          docker export "$(docker create --platform linux/arm/v7 steamlink-rootfs)" > rootfs.tar
          docker run --rm --platform linux/arm/v7 steamlink-rootfs \
            sh -c 'cat /etc/debian_version; dpkg -l | grep -c ^ii'

      - name: Create disk image
        run: sudo rootfs/build.sh

      - uses: actions/upload-artifact@v6
        with:
          name: steamlink-debian
          path: steamlink-debian.img.xz
          compression-level: 0
