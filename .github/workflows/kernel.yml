name: Build kernel

# Builds the kernel once per config and stores it as a GitHub Release, so the
# image build can download it (kernel/fetch.sh) instead of recompiling.
# Called by image.yml; can also be run on its own.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out release tag
        run: kernel/release-info.sh | tee -a "$GITHUB_ENV"

      - name: Check for an existing build
        id: existing
        run: |
          if gh release view "$KERNEL_TAG" > /dev/null 2>&1; then
            echo "::notice::$KERNEL_TAG is already built, nothing to do"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.existing.outputs.found != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libelf-dev libssl-dev kmod

      - name: Download kernel source
        if: steps.existing.outputs.found != 'true'
        run: |
          curl -fsSL --retry 3 "https://cdn.kernel.org/pub/linux/kernel/v${KERNEL_VERSION%%.*}.x/linux-$KERNEL_VERSION.tar.xz" | tar -xJ

      - name: Download Steam Link SDK toolchain
        if: steps.existing.outputs.found != 'true'
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/ValveSoftware/steamlink-sdk.git
          git -C steamlink-sdk sparse-checkout set toolchain

      - name: Build
        if: steps.existing.outputs.found != 'true'
        run: kernel/build.sh "linux-$KERNEL_VERSION" steamlink-sdk out

      - name: Publish release
        if: steps.existing.outputs.found != 'true'
        run: |
          # Another run may have published the same config meanwhile, which is fine
          gh release create "$KERNEL_TAG" "out/kernel-$KERNEL_VERSION.tar.gz" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "Linux $KERNEL_VERSION-steam ($KERNEL_TAG)" \
            --notes "Prebuilt Steam Link kernel from \`kernel/$KERNEL_VERSION.config\` at $GITHUB_SHA. Download with \`kernel/fetch.sh\`." \
            || gh release view "$KERNEL_TAG" > /dev/null
